# Smoke-test configuration: a randomly initialised 2-layer backbone that trains in minutes on a CPU.
# Use it to check that the full pipeline runs end to end; it is NOT expected to reach the paper's numbers.
model:
  gnn_hidden: 32
  gnn_layers: 2
  message_passing: true
  backbone: gpt2
  pretrained: null
  d_model: 64
  n_layer: 2
  n_head: 2
  context_blocks: 3
  max_timesteps: 16
  lora_rank: 8
  lora_alpha: 8.0
  lora_dropout: 0.0
  shared_adapter: false
  pointer_dim: 32
  return_conditioning: true
  return_feat_dim: 8
  dropout: 0.0
  cap_scale: 100.0
  demand_scale: 20.0
  max_request_nodes: 10

train:
  batch_size: 32
  epochs: 1
  max_steps: 300
  lr: 1.0e-3
  weight_decay: 1.0e-4
  warmup_steps: 20
  schedule: constant
  grad_clip: 0.5
  num_workers: 0
  val_fraction: 0.05
  log_every: 20
  eval_every: 100
  seed: 0
  per_trajectory_loss: false
  completed_only: false
  amp: false
