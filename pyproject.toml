[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vne-gen"
version = "0.1.0"
description = "VNE-Gen: Virtual Network Embedding via Generative Sequence Modeling (reference implementation)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "VNE-Gen authors"}]
keywords = ["virtual network embedding", "offline reinforcement learning", "decision transformer", "graph neural networks", "pointer networks"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "networkx>=2.8",
    "pyyaml>=6.0",
    "torch>=2.0",
    "transformers>=4.30",
    "tqdm>=4.60",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/UESTC-LU/vne-gen"

[tool.setuptools.packages.find]
where = ["."]
include = ["vne_gen*"]

[tool.setuptools.package-data]
"vne_gen.data.topologies" = ["*.gml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py39"
